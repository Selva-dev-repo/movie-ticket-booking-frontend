<div class="login-container">
  <div class="image-style">
  <img src="../../../assets/images/CinemaTicketBooking.jpg" width="100%" height="300px" title="Ticket Booking"/>
  </div>
  <h2 class="login-heading">Login</h2>
  <form (ngSubmit)="onLogin()">
    <div class="login">
      <div class="username">
        <input type="text" id="userName" class="username" placeholder="Username" [(ngModel)]="users.userName" name="userName" required />
      </div>
      <div class="password">
        <input type="password" id="password" class="password" placeholder="Password" [(ngModel)]="users.password" name="password" required />
      </div>
      <button class="submit" type="submit">Login</button>
      <div *ngIf="loginMessage" class="login-message">
        {{ loginMessage }}
      </div>
    </div>
  </form>
</div>
