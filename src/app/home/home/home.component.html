<section class="upcoming-movies">
  <h2 class="section-title">Upcoming Movies</h2>
  <div class="movies-grid">
    <div class="movie-card" *ngFor="let movie of movies">
      <!-- <img [src]="movie.posterUrl" alt="{{ movie.movieTitle }} Poster" width="20%" class="movie-poster"> -->
      <img src="../../../assets/images/CinemaTicketPoster.jpg" alt="{{ movie.movieTitle }} Poster" width="50px" height="50px" class="movie-poster"/>
      <div class="movie-title">{{ movie.movieTitle }} - {{movie.duration}}</div>
      <div class="movie-genre">{{ movie.genre }}</div>
      <div class="movie-date">{{ movie.releaseDate | date: 'YYYY-MM-d' }}</div>
    </div>
  </div>
</section>
